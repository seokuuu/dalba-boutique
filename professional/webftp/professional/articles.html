{***  | professional/articles.php ***} { # header }
<script defer src="{=setBrowserCache(c.PATH_SKIN+'js/'+gThisDirName+'/articles.js')}"></script>
<!-- articles.js = 아티클 게시판(bdId=article) AJAX 렌더 + 카테고리(말머리) 탭 필터 -->
<main id="professional-articles" class="main-content font-kr">
    <section class="articles-intro section_theme" data-theme="light">
        <div class="wrapper">
            <h2 class="articles-intro__title">Articles</h2>
        </div>
    </section>

    <section id="articles" class="articles section_theme" data-theme="light">
        <div class="articles__container wrapper">
            <!-- 카테고리 탭 (Figma ARTICLES-PC-kr-01). data-filter = 게시판 말머리 값과 일치해야 함 -->
            <nav class="articles__tabs" aria-label="Articles category">
                <button type="button" class="articles__tab is-active" data-filter="NEWS">NEWS</button>
                <button type="button" class="articles__tab" data-filter="EVENT">EVENT</button>
                <button type="button" class="articles__tab" data-filter="COLLABORATION">COLLABORATION</button>
            </nav>

            <!--
              아티클 리스트 = 아티클 게시판(bdId=article)을 articles.js 가 AJAX(/board/list.php)로 렌더.
              운영: 제목=기사 제목 / 말머리=NEWS·EVENT·COLLABORATION / 대표이미지=썸네일.
              ⚠️ 아직 게시판 미생성이면 "등록된 게시글이 없습니다" 표시됨 → 게시판(article) 생성 필요.
            -->
            <ul id="articlesList" class="articles__list" data-bdid="article">
                <li class="articles__empty">게시글을 불러오는 중…</li>
            </ul>
        </div>
    </section>
</main>
<div class="breadcrumb"></div>
{ # footer }
