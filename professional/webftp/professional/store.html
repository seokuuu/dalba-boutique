{***  | professional/store.php ***} { # header }
<script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=pr4xnb33yf&submodules=geocoder"></script>
<script defer src="{=setBrowserCache(c.PATH_SKIN+'js/'+gThisDirName+'/store.js')}"></script>
<!-- store.js = professional 매장 스플릿뷰(왼쪽 검색리스트 + 오른쪽 상시 지도/전매장 마커). Figma STORE-PC-kr-01 -->
<main id="professional-store" class="main-content font-kr">
    <section class="store-intro section_theme" data-theme="light">
        <div class="wrapper">
            <h2 class="store-intro__title">Store</h2>
            <p class="store-intro__paragraph">달바 프로페셔널 제품을 살롱에서 만나보세요.</p>
        </div>
    </section>

    <section id="store" class="store store--split section_theme" data-theme="light">
        <div class="store_split wrapper">
            <!-- 왼쪽: 매장 검색 + 리스트 -->
            <div class="store_panel">
                <div class="store_search">
                    <p class="store_search_label">매장 검색</p>
                    <div class="store_search_box">
                        <input type="text" id="storeSearchInput" name="storeSearchInput" placeholder="지역, 매장명으로 검색" />
                        <button type="button" id="btnStoreClear" class="store_search_clear" aria-label="검색어 지우기">&times;</button>
                        <button type="button" id="btnStoreSearch" class="store_search_btn" aria-label="매장검색"></button>
                    </div>
                    <p class="store_search_count">
                        검색 된 매장은 총 <span id="storeSearchCount">0</span>건 입니다.
                    </p>
                </div>
                <!-- //store_search -->

                <!--
                  매장 리스트 = 매장 게시판(bdId=salon) 위젯 렌더.
                  각 <li> = data-name(제목) + data-view-url(상세). store.js 가 상세 fetch → 주소 → 지오코딩 → 마커.
                  ⚠️ 목록이 비면 includeWidget 커스텀 스킨 파일명 미지원 → 대안 확인(dalba_pro.md §5-4).
                -->
                <ul id="storeList" class="store_list" data-bdid="salon">
                    {=includeWidget('board/_board_article_store.html', ['bdId'=>'salon', 'listCnt'=>100])}
                </ul>
            </div>

            <!-- 오른쪽: 상시 지도 (전 매장 마커) -->
            <div class="store_map">
                <div id="naverMapContainer" class="naver-map-container"></div>
            </div>
        </div>
    </section>
</main>
<div class="breadcrumb"></div>
{ # footer }
