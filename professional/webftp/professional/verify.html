<!-- 인증 신청 폼 게이트: 로그인 필수(비로그인 → pro.html). 프로페셔널 등급 체크는 안 함(비-프로 회원이 신청하는 페이지) -->
<!--{ ? !gd_is_login() }-->
<script>location.replace('/main/html.php?htmid=professional/pro.html');</script>
<!--{ / }-->
<main id="professional-verify" class="verify-content font-kr">
    <!-- Figma 334-73: PRO Verification 신청 폼 (사업자/디자이너 탭) -->
    <section class="verify section_theme" data-theme="light">
        <div class="verify__inner wrapper">
            <h2 class="verify__title font-en-title">PRO Verification</h2>

            <!-- 유형 탭 -->
            <div class="verify__tabs" role="tablist">
                <button type="button" class="verify__tab is-active js-verify-tab" data-type="business" role="tab">사업자(원장)</button>
                <button type="button" class="verify__tab js-verify-tab" data-type="designer" role="tab">디자이너</button>
            </div>

            <!-- 안내 박스 -->
            <div class="verify__notice">
                PRO 회원은 관리자가 확인 후 인증(승인)이 완료됩니다.<br />
                회원가입 완료 시 가입하신 휴대폰으로 알림이 발송됩니다.<br />
                (영업일 기준 1일 이내 확인)
            </div>

            <!-- board 등록 필드/파일은 스킨에 두지 않고 verify.js가 FormData로 board_ps.php에 전송 (고도몰 스킨 보안필터 회피) -->
            <form id="proVerifyForm" class="verify__form" novalidate>
                <input type="hidden" id="applyType" value="business" />

                <!-- 사업자 전용: 제목 -->
                <p class="verify__section-tit js-type-business">사업자 정보 입력</p>
                <!-- 디자이너 전용: 제목 -->
                <p class="verify__section-tit js-type-designer" hidden>디자이너 정보 입력</p>

                <!-- 사업자등록번호 (사업자 탭 전용) -->
                <div class="verify__row js-type-business">
                    <label class="verify__label" for="busiNo">사업자등록번호 <span class="req">*</span></label>
                    <div class="verify__control verify__control--inline">
                        <input type="text" id="busiNo" name="busiNo" class="verify__input" inputmode="numeric" placeholder="'-' 없이 숫자만 입력" />
                        <button type="button" class="verify__sub-btn js-busino-check">중복확인</button>
                    </div>
                    <p class="verify__msg js-busino-msg" hidden></p>
                </div>

                <!-- 매장상호명 (공통) -->
                <div class="verify__row">
                    <label class="verify__label" for="company">매장상호명 <span class="req">*</span></label>
                    <div class="verify__control">
                        <input type="text" id="company" name="company" class="verify__input" />
                    </div>
                </div>

                <!-- 매장전화번호 (공통) -->
                <div class="verify__row">
                    <label class="verify__label" for="shopTel">매장전화번호</label>
                    <div class="verify__control">
                        <input type="text" id="shopTel" name="shopTel" class="verify__input" inputmode="tel" />
                    </div>
                </div>

                <!-- 사업자등록증 파일 (공통) -->
                <div class="verify__row">
                    <label class="verify__label" for="fileBizCert">사업자등록증 <span class="req">*</span></label>
                    <div class="verify__control verify__control--file">
                        <input type="text" class="verify__input js-file-name" placeholder="파일을 선택해주세요" readonly />
                        <button type="button" class="verify__sub-btn js-file-trigger" data-target="fileBizCert">파일찾기</button>
                        <input type="file" id="fileBizCert" class="verify__file" accept="image/*,.pdf" hidden />
                    </div>
                </div>

                <!-- 디자이너자격증 파일 (디자이너 탭 전용) -->
                <div class="verify__row js-type-designer" hidden>
                    <label class="verify__label" for="fileDesignerCert">디자이너자격증 <span class="req">*</span></label>
                    <div class="verify__control verify__control--file">
                        <input type="text" class="verify__input js-file-name" placeholder="파일을 선택해주세요" readonly />
                        <button type="button" class="verify__sub-btn js-file-trigger" data-target="fileDesignerCert">파일찾기</button>
                        <input type="file" id="fileDesignerCert" class="verify__file" accept="image/*,.pdf" hidden />
                    </div>
                </div>

                <p class="verify__hint">
                    업로드 자료를 관리자가 확인 후 가입승인이 진행됩니다.<br />
                    피부, 네일, 메이크업 미용사 자격증은 가입이 불가능합니다.
                </p>

                <!-- 거래 동의 (필수) -->
                <div class="verify__agree">
                    <label class="verify__agree-label">
                        <input type="checkbox" id="agreeDeal" name="agreeDeal" class="verify__agree-check" />
                        <span><strong>(필수)</strong> 살롱/헤어디자이너 거래 동의</span>
                    </label>
                    <a href="/main/html.php?htmid=professional/terms_deal.html" target="_blank" class="verify__agree-more">전체보기</a>
                </div>

                <p class="verify__error js-form-error" role="alert" hidden></p>

                <button type="submit" class="verify__submit js-verify-submit">사업자 인증 신청</button>
            </form>
        </div>
    </section>
</main>
<div class="breadcrumb"></div>
{ # footer }
